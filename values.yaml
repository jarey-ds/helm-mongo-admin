db:
  enabled: true

deployments:
  database:
    replicaCount: 1
    pod:
      name: db-pod
      container:
        name: db-container
        image:
          repository: mongo
          tag: "5.0"
        ports:
          containerPort: 27017
        volumeMounts:
          mountPath: /data/db
        env:
          username: MONGO_INITDB_ROOT_USERNAME
          password: MONGO_INITDB_ROOT_PASSWORD
    volume:
      name: mongo-db-volume

  web:
    replicaCount: 1
    pod:
      name: web-pod
      container:
        name: web-container
        image:
          repository: mongo-express
          tag: latest
          pullPolicy: Never  # Default to Never if not specified
        ports:
          containerPort: 8081
        env:
          server: ME_CONFIG_MONGODB_SERVER
          username: ME_CONFIG_MONGODB_ADMINUSERNAME
          password: ME_CONFIG_MONGODB_ADMINPASSWORD

service:
  db:
    type: ClusterIP
    ports:
      protocol: TCP
      port: 27017
      targetPort: 27017
  
  web:
    type: NodePort
    ports:
      protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30111

secret:
  type: Opaque
  username: user101
  password: pass101

web:
  secret:
    type: Opaque
    mongodbAdminUsername: user101
    mongodbAdminPassword: pass101
    # Basic authentication for mongo-express UI (enabled for testing)
    basicAuthUsername: admin
    basicAuthPassword: admin123
    # Session and cookie secrets (required for mongo-express sessions)
    sessionSecret: "my-session-secret-key-change-in-production"
    cookieSecret: "my-cookie-secret-key-change-in-production"
  oidc:
    enabled: false
    # OAuth2 Issuer URL (root URL to the openidconnect metadata)
    # Example: "https://accounts.google.com" or "https://login.microsoftonline.com/{tenant-id}"
    issuer: ""
    # OAuth2 ClientId (the client must be private and allowed to perform Authorization Code Flow)
    clientId: ""
    # OAuth2 Client Secret (stored in secret)
    clientSecret: ""
    # Random secret used by the library to init the Authorization Code Flow (stored in secret)
    secret: ""
    # OAuth2 base url for redirect URL (optional, uses ME_CONFIG_SITE_BASEURL if not specified)
    # Example: "https://mongo-express.example.com"
    baseUrl: ""

persistentVolume:
  accessModes: ReadWriteMany
  storage: 0.5Gi
  localPath: /storage/mongo
  host:
    name: minikube

persistentVolumeClaim:
  accessModes: ReadWriteMany
  resourceRequest: 300Mi
  storageClassName: ""