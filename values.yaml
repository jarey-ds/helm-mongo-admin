# MongoDB Community Operator configuration
# Set to true only if you want this chart to install the operator as a dependency
# Set to false if the operator is already installed in your cluster (recommended)
# The MongoDBCommunity CRD will work as long as the operator is present in the cluster
community-operator:
  enabled: false

# MongoDB database deployment configuration
db:
  enabled: true
  # MongoDBCommunity CRD configuration (used when db.enabled is true)
  mongodbCommunity:
    # Name of the MongoDBCommunity resource
    name: mongodb
    # Number of members in the replica set
    members: 3
    # Type of deployment
    type: ReplicaSet
    # MongoDB version
    version: "6.0.5"
    # Security configuration
    security:
      authentication:
        modes: ["SCRAM"]  # Supports both SCRAM-SHA-1 and SCRAM-SHA-256
    # MongoDB connection authentication mechanism
    # Options: SCRAM-SHA-256 (recommended, default for MongoDB 4.0+), SCRAM-SHA-1 (legacy)
    authMechanism: "SCRAM-SHA-256"
    # MongoDB users configuration
    users:
      - name: admin-user
        db: admin
        # Reference to the secret containing the user's password
        passwordSecretRef:
          name: mongodb-admin-password
        roles:
          - name: clusterAdmin
            db: admin
          - name: userAdminAnyDatabase
            db: admin
          - name: readAnyDatabase
            db: admin
          - name: readWriteAnyDatabase
            db: admin
        # Name of the secret that will store SCRAM credentials
        scramCredentialsSecretName: mongodb-admin-scram
    # Additional MongoDB configuration
    additionalMongodConfig:
      storage.wiredTiger.engineConfig.journalCompressor: zlib

# Mongo Express (web UI) deployment configuration
deployments:
  web:
    replicaCount: 1
    pod:
      name: web-pod
      container:
        name: web-container
        image:
          repository: mongo-express
          tag: latest
          #repository: mongo-express
          #tag: cinfo
          pullPolicy: Never  # Default to Never if not specified
        ports:
          containerPort: 8081
        env:
          server: ME_CONFIG_MONGODB_SERVER
          username: ME_CONFIG_MONGODB_ADMINUSERNAME
          password: ME_CONFIG_MONGODB_ADMINPASSWORD

service:
  web:
    type: NodePort
    ports:
      protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30111

ingress:
  web:
    enabled: true
    ingressClassName: nginx  # Default to nginx, can be changed to other ingress controllers
    annotations:
      # nginx ingress controller annotations
      # Do NOT use rewrite-target as it interferes with OIDC callback paths
      # Proxy settings for proper backend communication and OIDC callbacks
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      # Increase buffer sizes to handle OIDC responses
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
      # Preserve original request headers and query parameters for OIDC callbacks
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      # Ensure query parameters are preserved
      nginx.ingress.kubernetes.io/use-regex: "false"
    hosts:
      - host: mongo-express.local
        paths:
          - path: /
            pathType: Prefix
    # TLS configuration (optional)
    tls: []
      # - secretName: mongo-express-tls
      #   hosts:
      #     - mongo-express.local

# MongoDB database credentials
# When db.enabled is true: These credentials are used for BOTH MongoDBCommunity user AND mongo-express
#   - The MongoDBCommunity user is created with: db.mongodbCommunity.users[0].name and secret.password
#   - mongo-express uses the same credentials automatically
# When db.enabled is false: Use web.secret.mongodbAdminUsername/Password to connect to external MongoDB
secret:
  type: Opaque
  username: user101  # Not used when db.enabled is true (MongoDBCommunity user name is used instead)
  password: pass101   # Used as MongoDBCommunity user password when db.enabled is true

web:
  enabled: true
  secret:
    type: Opaque
    # MongoDB credentials for mongo-express
    # When db.enabled is true: These are IGNORED - MongoDBCommunity user credentials are used instead
    # When db.enabled is false: Use these to connect to an external MongoDB instance
    mongodbAdminUsername: user101
    mongodbAdminPassword: pass101
    # Session and cookie secrets (required for mongo-express sessions)
    # These are needed regardless of authentication method (basic auth or OIDC)
    sessionSecret: "my-session-secret-key-change-in-production"
    cookieSecret: "my-cookie-secret-key-change-in-production"
  # Basic authentication configuration
  # Note: Basic auth is automatically disabled when OIDC is enabled
  # Set enabled: true only if you want basic auth without OIDC
  basicAuth:
    enabled: false  # Set to true to enable basic auth (will be disabled if OIDC is enabled)
    username: admin
    password: admin123
  oidc:
    enabled: true
    # Keycloak OAuth2 Issuer URL (full path to openid-configuration)
    # Format: https://keycloak-host/realms/{realm-name}/.well-known/openid-configuration
    issuer: "https://keycloak.local/realms/master/.well-known/openid-configuration"
    # Allow self-signed certificates (for development/testing only)
    # Set to true if Keycloak uses self-signed certificates
    allowInsecureCertificates: true
    # OAuth2 ClientId configured in Keycloak
    clientId: "mongoexpress"
    # OAuth2 Client Secret from Keycloak (stored in secret)
    clientSecret: "J0CJupr908vWJcnSQtmg9RDRfjzQUe5c"
    # Random secret used by the library to init the Authorization Code Flow (stored in secret)
    # Generate a secure random string for production use
    secret: "mongo-express-oidc-secret-key-change-in-production-2024"
    # OAuth2 base url for redirect URL (REQUIRED for OIDC)
    # This is the public URL where mongo-express is accessible
    # For Ingress (recommended): http://mongo-express.local or https://mongo-express.local
    # For NodePort service: http://<node-ip>:30111
    # For minikube with ingress: http://mongo-express.local (add to /etc/hosts: <ingress-ip> mongo-express.local)
    baseUrl: "http://mongo-express.local"  # Update with your actual URL (use ingress hostname if ingress is enabled)

persistentVolume:
  accessModes: ReadWriteMany
  storage: 0.5Gi
  localPath: /storage/mongo
  host:
    name: minikube

persistentVolumeClaim:
  accessModes: ReadWriteMany
  resourceRequest: 300Mi
  storageClassName: ""